<div class="shell">
  <header class="navbar">
    <button class="navbar__btn" type="button" (click)="toggleNav()" [attr.aria-expanded]="navExpanded()" aria-label="Toggle navigation">
      <svg height="24" width="24" fill="currentColor" viewBox="0 -960 960 960" aria-hidden="true">
        <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z" />
      </svg>
    </button>
    <a class="navbar__brand" routerLink="/">
      <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
        <path d="M12 2 3 6v6c0 5 3.8 9.3 9 10 5.2-.7 9-5 9-10V6l-9-4Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M7.5 12.5h3l1.5-3 2 6 1.5-3h1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>AML Monitor</span>
    </a>
    <div class="navbar__right">
      <span class="navbar__date">{{ today | date:'EEE, d MMM y' }}</span>
      <button class="navbar__btn navbar__logout" type="button" (click)="logout()" title="Sign out" aria-label="Sign out">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0" /><line x1="12" y1="2" x2="12" y2="12" />
        </svg>
      </button>
    </div>
  </header>

  <div class="body">
    @if (mobileOpen()) { <div class="scrim" (click)="mobileOpen.set(false)"></div> }

    <aside class="side" [class.side--collapsed]="collapsed()" [class.side--open]="mobileOpen()">
      <nav class="side__nav" (click)="mobileOpen.set(false)">
        @for (item of nav(); track item.path) {
          <a class="nav-item" [routerLink]="item.path" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: item.exact }" [title]="collapsed() ? item.label : ''">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              @switch (item.icon) {
                @case ('overview') {
                  <path d="M4 20V4" /><path d="M4 20h16" />
                  <rect x="7" y="11" width="3" height="6" rx="1" /><rect x="12" y="7" width="3" height="10" rx="1" /><rect x="17" y="13" width="3" height="4" rx="1" />
                }
                @case ('alerts') {
                  <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" />
                }
                @case ('transactions') {
                  <path d="M17 3l4 4-4 4" /><path d="M3 7h18" /><path d="M7 21l-4-4 4-4" /><path d="M21 17H3" />
                }
                @case ('customers') {
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" />
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" />
                }
                @case ('screening') {
                  <circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" />
                }
                @case ('sars') {
                  <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" />
                  <path d="M9 17v-3" /><path d="M12 17v-5" /><path d="M15 17v-2" />
                }
                @case ('rules') {
                  <path d="M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z" /><path d="M9 12l2 2 4-4" />
                }
                @case ('users') {
                  <circle cx="12" cy="8" r="4" /><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1" />
                  <path d="M19 3l1.5 1.5L23 2" />
                }
              }
            </svg>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        }
      </nav>

      <div class="user-card">
        <div class="user-card__avatar">{{ initials() }}</div>
        @if (auth.user(); as u) {
          <div class="user-card__text">
            <span class="user-card__name" [title]="u.username">{{ u.displayName }}</span>
            <span class="user-card__role">{{ u.role === 'MLRO' ? 'MLRO' : (u.role | label) }} · {{ u.username }}</span>
          </div>
        }
      </div>
    </aside>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
