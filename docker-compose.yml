services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aml
      POSTGRES_USER: aml
      POSTGRES_PASSWORD: aml
    ports:
      - "5432:5432"
    volumes:
      - aml-data:/var/lib/postgresql/data

  # Local SMTP server that catches every email: SMTP on :1025, inbox at http://localhost:8025.
  # Never delivers anything, so it is safe for demo data.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  aml-data:
